<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ chi tiêu — Duy &amp; Nghĩa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --paper: #EDF2E9;
    --paper-line: #C9D9C0;
    --paper-edge: #DCE7D5;
    --ink: #1F3A2E;
    --ink-soft: #4B5D4F;
    --duy-ink: #2B4C7E;
    --duy-bg: #E4EBF4;
    --nghia-ink: #8B3A3A;
    --nghia-bg: #F3E6E4;
    --stamp: #A6742E;
  }
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: repeating-linear-gradient(
      var(--paper),
      var(--paper) 27px,
      var(--paper-line) 28px
    );
    background-color: var(--paper);
    color: var(--ink);
    font-family: 'Courier Prime', monospace;
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .page{
    max-width: 640px;
    margin: 0 auto;
  }
  header.cover{
    text-align:center;
    margin-bottom: 28px;
    padding-bottom: 18px;
    border-bottom: 3px double var(--ink);
  }
  header.cover .eyebrow{
    letter-spacing: 3px;
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
  }
  header.cover h1{
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 30px;
    margin: 6px 0 4px;
    letter-spacing: 0.5px;
  }
  header.cover .subtitle{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .live-clock{
    text-align:center;
    margin-bottom: 18px;
  }
  .live-clock .clock-date{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .live-clock .clock-time{
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 1px;
  }

  .month-nav{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 18px;
    margin-bottom: 22px;
  }
  .month-nav button{
    background: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-family: 'Courier Prime', monospace;
    font-size: 16px;
    line-height: 1;
  }
  .month-nav button:hover{ background: var(--paper-line); }
  .month-nav .month-label{
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 18px;
    min-width: 150px;
    text-align:center;
  }

  .slip{
    background: #fff;
    border: 1px dashed var(--ink-soft);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 28px;
    box-shadow: 0 2px 6px rgba(31,58,46,0.08);
  }
  .slip .slip-title{
    font-family:'Zilla Slab', serif;
    font-weight:700;
    font-size:14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .photo-row{
    display:flex;
    align-items:center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .photo-preview{
    width: 64px; height: 64px;
    border-radius: 4px;
    object-fit: cover;
    border: 1px solid var(--paper-line);
    background: var(--paper);
    flex-shrink:0;
  }
  .photo-placeholder{
    width:64px; height:64px;
    border-radius:4px;
    border: 1px dashed var(--paper-line);
    display:flex; align-items:center; justify-content:center;
    font-size: 22px;
    color: var(--ink-soft);
    flex-shrink:0;
    background: var(--paper);
  }
  .btn-camera{
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px 16px;
    border-radius: 4px;
    font-family: 'Courier Prime', monospace;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-camera:hover{ opacity: 0.85; }
  input[type="file"]{ display:none; }

  .field{
    margin-bottom: 12px;
  }
  .field label{
    display:block;
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 4px;
  }
  .field input[type="text"], .field input[type="number"]{
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    font-family: 'Courier Prime', monospace;
    font-size: 14px;
    background: var(--paper);
    color: var(--ink);
  }
  .field input:focus{
    outline: 2px solid var(--ink);
    outline-offset: 1px;
  }
  .person-toggle{
    display:flex;
    gap: 10px;
  }
  .person-toggle label{
    flex: 1;
    text-align:center;
    padding: 10px 8px;
    border-radius: 4px;
    border: 1px solid var(--paper-line);
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    text-transform: none;
    letter-spacing: 0;
    color: var(--ink-soft);
  }
  .person-toggle input{ display:none; }
  .person-toggle .opt-duy.active{
    background: var(--duy-bg);
    border-color: var(--duy-ink);
    color: var(--duy-ink);
  }
  .person-toggle .opt-nghia.active{
    background: var(--nghia-bg);
    border-color: var(--nghia-ink);
    color: var(--nghia-ink);
  }

  .btn-submit{
    width: 100%;
    padding: 12px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    cursor: pointer;
    margin-top: 6px;
  }
  .btn-submit:hover{ opacity: 0.88; }
  .btn-submit:disabled{ opacity: 0.4; cursor: not-allowed; }

  .ledger-title{
    font-family:'Zilla Slab', serif;
    font-weight:700;
    font-size:14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 10px 4px;
  }
  .ledger{
    margin-bottom: 26px;
  }
  .ledger .empty{
    text-align:center;
    color: var(--ink-soft);
    padding: 30px 10px;
    font-style: italic;
    font-size: 14px;
  }
  .row{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--paper-line);
  }
  .row .thumb{
    width: 46px; height: 46px;
    border-radius: 4px;
    object-fit: cover;
    border: 1px solid var(--paper-line);
    flex-shrink:0;
    cursor: zoom-in;
  }
  .row .thumb-placeholder{
    width:46px; height:46px;
    border-radius:4px;
    border: 1px dashed var(--paper-line);
    display:flex; align-items:center; justify-content:center;
    font-size: 16px;
    color: var(--ink-soft);
    flex-shrink:0;
  }
  .row .info{
    flex: 1;
    min-width: 0;
  }
  .row .item-name{
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row .date-tag{
    font-size: 11px;
    color: var(--ink-soft);
  }
  .row .price{
    font-weight: 700;
    font-size: 14px;
    white-space: nowrap;
  }
  .tag{
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .tag.duy{ background: var(--duy-bg); color: var(--duy-ink); }
  .tag.nghia{ background: var(--nghia-bg); color: var(--nghia-ink); }
  .row .del{
    background:none;
    border:none;
    color: var(--ink-soft);
    cursor:pointer;
    font-size: 16px;
    padding: 4px;
    flex-shrink:0;
  }
  .row .del:hover{ color: var(--nghia-ink); }

  .stamp-wrap{
    display:flex;
    justify-content:center;
    margin: 30px 0 10px;
  }
  .stamp{
    border: 3px solid var(--stamp);
    border-radius: 8px;
    color: var(--stamp);
    padding: 16px 26px;
    transform: rotate(-2deg);
    text-align:center;
    position: relative;
  }
  .stamp::before{
    content: "TỔNG KẾT THÁNG";
    display:block;
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .stamp .lines{
    display:flex;
    gap: 22px;
  }
  .stamp .lines div{
    text-align:center;
  }
  .stamp .lines .who{
    font-size: 11px;
    letter-spacing: 1px;
    margin-bottom: 3px;
  }
  .stamp .lines .amt{
    font-family: 'Zilla Slab', serif;
    font-weight: 700;
    font-size: 17px;
  }
  .stamp .grand{
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--stamp);
    font-size: 13px;
    font-weight: 700;
  }

  .lightbox{
    position: fixed; inset:0;
    background: rgba(31,58,46,0.85);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 100;
    padding: 20px;
    cursor: zoom-out;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{
    max-width: 100%;
    max-height: 90vh;
    border-radius: 6px;
  }

  .pin-modal{
    position: fixed; inset:0;
    background: rgba(31,58,46,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 600;
    padding: 20px;
  }
  .pin-modal.show{ display:flex; }
  .pin-box{
    background:#fff;
    border-radius: 8px;
    padding: 24px 22px;
    width: 100%;
    max-width: 280px;
    text-align:center;
    box-shadow: 0 10px 30px rgba(31,58,46,0.25);
    border: 1px solid var(--paper-line);
  }
  .pin-box .pin-icon{
    font-size: 26px;
    margin-bottom: 8px;
  }
  .pin-box .pin-title{
    font-family:'Zilla Slab', serif;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.5px;
    margin-bottom: 14px;
    color: var(--ink);
  }
  .pin-box input{
    width: 100%;
    text-align:center;
    letter-spacing: 4px;
    padding: 10px;
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    font-family:'Courier Prime', monospace;
    font-size: 16px;
    background: var(--paper);
    color: var(--ink);
    margin-bottom: 14px;
  }
  .pin-box input:focus{
    outline: 2px solid var(--ink);
    outline-offset: 1px;
  }
  .pin-box .pin-actions{
    display:flex;
    gap: 8px;
  }
  .pin-box .pin-actions button{
    flex: 1;
    padding: 9px;
    border-radius: 4px;
    font-family:'Courier Prime', monospace;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--ink);
  }
  .pin-box .pin-cancel{
    background: #fff;
    color: var(--ink-soft);
  }
  .pin-box .pin-confirm{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  /* --- access gate --- */
  .gate-overlay{
    position: fixed; inset:0;
    background: var(--paper);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 500;
    padding: 24px;
  }
  .gate-overlay.show{ display:flex; }
  .gate-box{
    text-align:center;
    max-width: 320px;
  }
  .gate-icon{
    font-size: 40px;
    margin-bottom: 14px;
  }
  .gate-title{
    font-family:'Zilla Slab', serif;
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 8px;
  }
  .gate-subtitle{
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin-bottom: 22px;
  }
  .gate-dots{
    display:flex;
    justify-content:center;
    gap: 6px;
    margin-bottom: 22px;
  }
  .gate-dots span{
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--ink-soft);
    opacity: 0.3;
    animation: gatePulse 1.2s infinite ease-in-out;
  }
  .gate-dots span:nth-child(2){ animation-delay: 0.2s; }
  .gate-dots span:nth-child(3){ animation-delay: 0.4s; }
  @keyframes gatePulse{
    0%, 80%, 100%{ opacity: 0.25; transform: scale(0.85); }
    40%{ opacity: 1; transform: scale(1); }
  }
  .gate-admin-link{
    cursor: pointer;
  }

  /* --- admin fab & panel --- */
  .admin-fab{
    position: fixed;
    bottom: 18px;
    right: 18px;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-size: 18px;
    cursor: pointer;
    z-index: 300;
    opacity: 0.55;
    display: flex;
    align-items:center;
    justify-content:center;
  }
  .admin-fab:hover{ opacity: 1; }
  .admin-fab.is-admin{
    width: auto;
    border-radius: 20px;
    padding: 0 14px;
    font-size: 12px;
    font-weight: 700;
    gap: 6px;
    font-family:'Courier Prime', monospace;
  }
  .admin-panel{
    position: fixed; inset:0;
    background: rgba(31,58,46,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index: 600;
    padding: 20px;
  }
  .admin-panel.show{ display:flex; }
  .admin-panel-box{
    background:#fff;
    border-radius: 8px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 10px 30px rgba(31,58,46,0.25);
    border: 1px solid var(--paper-line);
  }
  .admin-panel-title{
    font-family:'Zilla Slab', serif;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .admin-panel-title button{
    background:none;
    border:none;
    font-size: 18px;
    cursor:pointer;
    color: var(--ink-soft);
  }
  .empty-pending{
    text-align:center;
    color: var(--ink-soft);
    font-size: 13px;
    font-style: italic;
    padding: 20px 0;
  }
  .pending-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--paper-line);
  }
  .pending-info{
    font-size: 13px;
    line-height: 1.4;
  }
  .pending-time{
    font-size: 11px;
    color: var(--ink-soft);
  }
  .pending-actions{
    display:flex;
    gap: 6px;
    flex-shrink:0;
  }
  .pending-actions button{
    padding: 6px 10px;
    border-radius: 4px;
    font-family:'Courier Prime', monospace;
    font-size: 11px;
    font-weight: 700;
    cursor:pointer;
    border: 1px solid var(--ink);
  }
  .approve-btn{ background: var(--ink); color: var(--paper); }
  .deny-btn{ background: #fff; color: var(--nghia-ink); border-color: var(--nghia-ink); }

  footer.note{
    text-align:center;
    font-size: 45px;
    color: var(--ink-soft);
    margin-top: 30px;
  }
</style>
</head>
<body>

<div class="gate-overlay show" id="gateOverlay">
  <div class="gate-box">
    <div class="gate-icon" id="gateIcon">🔒</div>
    <div class="gate-title" id="gateTitle">Đang chờ Duy duyệt truy cập</div>
    <div class="gate-subtitle" id="gateSubtitle">Yêu cầu của bạn đã được gửi. Trang sẽ tự mở ra khi được <span class="gate-admin-link" id="gateAdminLink">Duy</span> duyệt, không cần tải lại.</div>
    <div class="gate-dots" id="gateDots"><span></span><span></span><span></span></div>
  </div>
</div>

<button class="admin-fab" id="adminFab" title="Quản lý truy cập">🔑</button>

<div class="admin-panel" id="adminPanel">
  <div class="admin-panel-box">
    <div class="admin-panel-title">
      <span>Yêu cầu chờ duyệt</span>
      <button id="closeAdminPanel" type="button">✕</button>
    </div>
    <div id="pendingList"></div>
  </div>
</div>

<div class="page">

  <header class="cover">
    <div class="eyebrow">Ghi chép mua sắm hàng tháng</div>
    <h1>Sổ Chi Tiêu Chung</h1>
    <div class="subtitle">Duy &amp; Nghĩa</div>
  </header>

  <div class="live-clock">
    <div class="clock-time" id="clockTime">--:--:--</div>
    <div class="clock-date" id="clockDate">-- -- --</div>
  </div>

  <div class="slip">
    <div class="slip-title">Ghi khoản chi mới</div>

    <div class="photo-row">
      <img id="photoPreview" class="photo-preview" style="display:none;" alt="Ảnh đồ đã mua">
      <div id="photoPlaceholder" class="photo-placeholder">📷</div>
      <input type="file" id="photoInput" accept="image/*">
      <button class="btn-camera" id="btnCamera" type="button">Chụp / chọn ảnh</button>
    </div>

    <div class="field">
      <label for="itemName">Tên đồ</label>
      <input type="text" id="itemName" placeholder="Vd: Cà phê, gạo, xăng xe...">
    </div>

    <div class="field">
      <label for="itemPrice">Số tiền</label>
      <input type="number" id="itemPrice" placeholder="Vd: 50 = 50.000 ₫" min="0" inputmode="numeric">
    </div>

    <div class="field">
      <label>Người chi</label>
      <div class="person-toggle">
        <label class="opt-duy active" id="labelDuy">
          <input type="radio" name="person" value="Duy" checked> Duy
        </label>
        <label class="opt-nghia" id="labelNghia">
          <input type="radio" name="person" value="Nghĩa"> Nghĩa
        </label>
      </div>
    </div>

    <button class="btn-submit" id="btnSubmit">Ghi vào sổ</button>
  </div>

  <div class="month-nav">
    <button id="prevMonth" aria-label="Tháng trước">&#8592;</button>
    <div class="month-label" id="monthLabel">Tháng 7 / 2026</div>
    <button id="nextMonth" aria-label="Tháng sau">&#8594;</button>
  </div>

  <div class="ledger-title">Lịch sử chi tiêu</div>
  <div class="ledger" id="ledger">
    <!-- rows injected here -->
  </div>

  <div class="stamp-wrap" id="stampWrap"></div>

  <footer class="note">Vin_Robotics</footer>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt="Ảnh phóng to"></div>

<div class="pin-modal" id="pinModal">
  <div class="pin-box">
    <div class="pin-icon">🔒</div>
    <div class="pin-title">Mã bảo mật</div>
    <input type="password" id="pinInput" inputmode="numeric" placeholder="••••••••">
    <div class="pin-actions">
      <button class="pin-cancel" id="pinCancel" type="button">Hủy</button>
      <button class="pin-confirm" id="pinConfirm" type="button">Xác nhận</button>
    </div>
  </div>
</div>

<script>
(function(){
  // --- Firebase setup ---
  const firebaseConfig = {
    apiKey: "AIzaSyBeqpuLJhY6KaIjg8j28GwObhNZy6-WDDM",
    authDomain: "so-chi-tieu-duy-nghia.firebaseapp.com",
    projectId: "so-chi-tieu-duy-nghia",
    storageBucket: "so-chi-tieu-duy-nghia.firebasestorage.app",
    messagingSenderId: "148452743367",
    appId: "1:148452743367:web:e3ee9fe23d9a0b5016c6e2"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const expensesRef = db.collection('expenses');
  const accessCollection = db.collection('access_requests');
  const AUTO_DELETE_MONTHS = 2;
  const DELETE_PIN = '22092004';

  let entries = [];
  let currentPhotoData = null;
  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-indexed

  const monthLabel = document.getElementById('monthLabel');
  const ledgerEl = document.getElementById('ledger');
  const stampWrap = document.getElementById('stampWrap');
  const photoInput = document.getElementById('photoInput');
  const btnCamera = document.getElementById('btnCamera');
  const photoPreview = document.getElementById('photoPreview');
  const photoPlaceholder = document.getElementById('photoPlaceholder');
  const itemName = document.getElementById('itemName');
  const itemPrice = document.getElementById('itemPrice');
  const btnSubmit = document.getElementById('btnSubmit');
  const labelDuy = document.getElementById('labelDuy');
  const labelNghia = document.getElementById('labelNghia');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');

  function fmtVND(n){
    return Number(n||0).toLocaleString('vi-VN') + ' ₫';
  }

  // --- real-time clock ---
  const clockTimeEl = document.getElementById('clockTime');
  const clockDateEl = document.getElementById('clockDate');
  const weekdays = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
  function tickClock(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    clockTimeEl.textContent = hh + ':' + mm + ':' + ss;
    const dd = String(now.getDate()).padStart(2,'0');
    const mo = String(now.getMonth()+1).padStart(2,'0');
    clockDateEl.textContent = weekdays[now.getDay()] + ', ' + dd + '/' + mo + '/' + now.getFullYear();
  }
  tickClock();
  setInterval(tickClock, 1000);

  let unsubscribed = false;

  function listenEntries(){
    expensesRef.orderBy('date', 'desc').onSnapshot((snapshot) => {
      entries = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      cleanupOldEntries();
      render();
    }, (err) => {
      console.error(err);
      if(!unsubscribed){
        unsubscribed = true;
        alert('Không kết nối được với dữ liệu chung. Kiểm tra lại kết nối mạng hoặc cấu hình Firebase.');
      }
    });
  }

  function cleanupOldEntries(){
    const cutoff = new Date();
    cutoff.setMonth(cutoff.getMonth() - AUTO_DELETE_MONTHS);
    entries.forEach(e => {
      if(new Date(e.date) < cutoff){
        expensesRef.doc(e.id).delete().catch(() => {});
      }
    });
  }

  // --- photo capture & compression ---
  btnCamera.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        currentPhotoData = canvas.toDataURL('image/jpeg', 0.6);
        photoPreview.src = currentPhotoData;
        photoPreview.style.display = 'block';
        photoPlaceholder.style.display = 'none';
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  // --- person toggle ---
  document.querySelectorAll('input[name="person"]').forEach(r => {
    r.addEventListener('change', () => {
      labelDuy.classList.toggle('active', document.querySelector('input[value="Duy"]').checked);
      labelNghia.classList.toggle('active', document.querySelector('input[value="Nghĩa"]').checked);
    });
  });

  // --- submit ---
  btnSubmit.addEventListener('click', async () => {
    const rawInput = parseFloat(itemPrice.value);
    if(!rawInput || rawInput <= 0){
      alert('Vui lòng nhập số tiền hợp lệ (đơn vị nghìn đồng).');
      return;
    }
    const price = rawInput * 1000;
    const person = document.querySelector('input[name="person"]:checked').value;
    const now = new Date();

    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Đang lưu...';
    try{
      await expensesRef.add({
        date: now.toISOString(),
        item: itemName.value.trim() || '(không ghi tên)',
        price: price,
        person: person,
        photo: currentPhotoData
      });
    }catch(e){
      alert('Không lưu được, kiểm tra lại kết nối mạng rồi thử lại.');
    }
    btnSubmit.disabled = false;
    btnSubmit.textContent = 'Ghi vào sổ';

    itemName.value = '';
    itemPrice.value = '';
    currentPhotoData = null;
    photoPreview.style.display = 'none';
    photoPlaceholder.style.display = 'flex';
    photoInput.value = '';

    viewYear = now.getFullYear();
    viewMonth = now.getMonth();
  });

  // --- month navigation ---
  document.getElementById('prevMonth').addEventListener('click', () => {
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    render();
  });
  document.getElementById('nextMonth').addEventListener('click', () => {
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    render();
  });

  // --- lightbox ---
  lightbox.addEventListener('click', () => lightbox.classList.remove('show'));

  // --- pin modal (dùng chung cho xoá & xác nhận là Duy) ---
  const pinModal = document.getElementById('pinModal');
  const pinInput = document.getElementById('pinInput');
  const pinCancelBtn = document.getElementById('pinCancel');
  const pinConfirmBtn = document.getElementById('pinConfirm');

  function askPin(){
    return new Promise((resolve) => {
      pinInput.value = '';
      pinModal.classList.add('show');
      setTimeout(() => pinInput.focus(), 50);

      function onConfirm(){ cleanup(pinInput.value); }
      function onCancel(){ cleanup(null); }
      function onKey(e){
        if(e.key === 'Enter'){ onConfirm(); }
        if(e.key === 'Escape'){ onCancel(); }
      }
      function onOverlayClick(e){
        if(e.target === pinModal){ onCancel(); }
      }
      function cleanup(result){
        pinModal.classList.remove('show');
        pinConfirmBtn.removeEventListener('click', onConfirm);
        pinCancelBtn.removeEventListener('click', onCancel);
        pinInput.removeEventListener('keydown', onKey);
        pinModal.removeEventListener('click', onOverlayClick);
        resolve(result);
      }
      pinConfirmBtn.addEventListener('click', onConfirm);
      pinCancelBtn.addEventListener('click', onCancel);
      pinInput.addEventListener('keydown', onKey);
      pinModal.addEventListener('click', onOverlayClick);
    });
  }

  // ============================================================
  // ACCESS GATE — chỉ Duy duyệt mới vào được trang
  // ============================================================
  function getDeviceId(){
    let id = localStorage.getItem('deviceId');
    if(!id){
      id = 'dev_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('deviceId', id);
    }
    return id;
  }
  const deviceId = getDeviceId();
  const myAccessRef = accessCollection.doc(deviceId);

  const gateOverlay = document.getElementById('gateOverlay');
  const gateIcon = document.getElementById('gateIcon');
  const gateTitle = document.getElementById('gateTitle');
  const gateSubtitle = document.getElementById('gateSubtitle');
  const gateDots = document.getElementById('gateDots');
  const gateAdminLink = document.getElementById('gateAdminLink');
  const adminFab = document.getElementById('adminFab');
  const adminPanel = document.getElementById('adminPanel');
  const closeAdminPanelBtn = document.getElementById('closeAdminPanel');
  const pendingListEl = document.getElementById('pendingList');

  let isAdmin = false;
  let pendingUnsub = null;

  async function ensureAccessDoc(){
    try{
      const snap = await myAccessRef.get();
      if(!snap.exists){
        await myAccessRef.set({
          status: 'pending',
          isAdmin: false,
          requestedAt: new Date().toISOString()
        });
      }
    }catch(e){
      gateTitle.textContent = 'Không kết nối được';
      gateSubtitle.textContent = 'Kiểm tra lại kết nối mạng rồi tải lại trang.';
      gateDots.style.display = 'none';
    }
  }

  function watchAccess(){
    myAccessRef.onSnapshot((doc) => {
      const data = doc.data();
      if(!data) return;
      isAdmin = !!data.isAdmin;

      updateAdminFab();

      if(data.status === 'approved'){
        gateOverlay.classList.remove('show');
      } else if(data.status === 'denied'){
        gateOverlay.classList.add('show');
        gateIcon.textContent = '⛔';
        gateTitle.textContent = 'Truy cập bị từ chối';
        gateSubtitle.innerHTML = '<span class="gate-admin-link" id="gateAdminLink">Duy</span> chưa cho phép thiết bị này truy cập.';
        gateDots.style.display = 'none';
      } else {
        gateOverlay.classList.add('show');
        gateIcon.textContent = '🔒';
        gateTitle.textContent = 'Đang chờ Duy duyệt truy cập';
        gateSubtitle.innerHTML = 'Yêu cầu của bạn đã được gửi. Trang sẽ tự mở ra khi được <span class="gate-admin-link" id="gateAdminLink">Duy</span> duyệt, không cần tải lại.';
        gateDots.style.display = 'flex';
      }
    });
  }

  function updateAdminFab(){
    if(isAdmin){
      adminFab.classList.add('is-admin');
      adminFab.textContent = '🔑 Quản lý truy cập';
    } else {
      adminFab.classList.remove('is-admin');
      adminFab.textContent = '🔑';
    }
  }

  async function handleAdminLogin(){
    const pin = await askPin();
    if(pin === null) return;
    if(pin !== DELETE_PIN){
      alert('Sai mã.');
      return;
    }
    try{
      await myAccessRef.set({
        status: 'approved',
        isAdmin: true,
        updatedAt: new Date().toISOString()
      }, { merge: true });
    }catch(e){
      alert('Có lỗi xảy ra, thử lại nhé.');
    }
  }

  // event delegation: chữ "Duy" trong câu văn được tạo lại mỗi lần cập nhật,
  // nên bắt sự kiện click ở phần tử cha ổn định thay vì gắn trực tiếp
  gateSubtitle.addEventListener('click', (e) => {
    if(e.target && e.target.id === 'gateAdminLink'){
      handleAdminLogin();
    }
  });

  adminFab.addEventListener('click', async () => {
    if(!isAdmin){
      const pin = await askPin();
      if(pin === null) return;
      if(pin !== DELETE_PIN){
        alert('Sai mã.');
        return;
      }
      try{
        await myAccessRef.set({
          status: 'approved',
          isAdmin: true,
          updatedAt: new Date().toISOString()
        }, { merge: true });
      }catch(e){
        alert('Có lỗi xảy ra, thử lại nhé.');
      }
      return;
    }
    openAdminPanel();
  });

  closeAdminPanelBtn.addEventListener('click', () => {
    adminPanel.classList.remove('show');
  });
  adminPanel.addEventListener('click', (e) => {
    if(e.target === adminPanel) adminPanel.classList.remove('show');
  });

  function openAdminPanel(){
    adminPanel.classList.add('show');
    if(pendingUnsub) pendingUnsub();
    pendingUnsub = accessCollection.where('status', '==', 'pending').onSnapshot((snap) => {
      const items = snap.docs.filter(d => d.id !== deviceId);
      pendingListEl.innerHTML = '';
      if(items.length === 0){
        pendingListEl.innerHTML = '<div class="empty-pending">Không có yêu cầu nào đang chờ.</div>';
        return;
      }
      items
        .sort((a,b) => new Date(a.data().requestedAt||0) - new Date(b.data().requestedAt||0))
        .forEach((docSnap) => {
          const data = docSnap.data();
          const t = data.requestedAt ? new Date(data.requestedAt) : null;
          const timeStr = t
            ? (String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0') + ' · ' + String(t.getDate()).padStart(2,'0') + '/' + String(t.getMonth()+1).padStart(2,'0'))
            : '';
          const row = document.createElement('div');
          row.className = 'pending-row';
          row.innerHTML = `
            <div class="pending-info">Thiết bị lạ<br><span class="pending-time">Yêu cầu lúc ${timeStr}</span></div>
            <div class="pending-actions">
              <button class="approve-btn">Duyệt</button>
              <button class="deny-btn">Từ chối</button>
            </div>
          `;
          row.querySelector('.approve-btn').addEventListener('click', async () => {
            await accessCollection.doc(docSnap.id).set({ status: 'approved', updatedAt: new Date().toISOString() }, { merge: true });
          });
          row.querySelector('.deny-btn').addEventListener('click', async () => {
            await accessCollection.doc(docSnap.id).set({ status: 'denied', updatedAt: new Date().toISOString() }, { merge: true });
          });
          pendingListEl.appendChild(row);
        });
    });
  }

  ensureAccessDoc().then(watchAccess);

  function render(){
    monthLabel.textContent = 'Tháng ' + (viewMonth+1) + ' / ' + viewYear;

    const monthEntries = entries.filter(e => {
      const d = new Date(e.date);
      return d.getFullYear() === viewYear && d.getMonth() === viewMonth;
    }).sort((a,b) => new Date(b.date) - new Date(a.date));

    ledgerEl.innerHTML = '';
    if(monthEntries.length === 0){
      ledgerEl.innerHTML = '<div class="empty">Chưa có khoản chi nào trong tháng này.</div>';
    } else {
      monthEntries.forEach(entry => {
        const row = document.createElement('div');
        row.className = 'row';
        const d = new Date(entry.date);
        const dd = String(d.getDate()).padStart(2,'0');
        const hh = String(d.getHours()).padStart(2,'0');
        const mi = String(d.getMinutes()).padStart(2,'0');
        const dateStr = 'Ngày ' + dd + ' · ' + hh + ':' + mi;
        const tagClass = entry.person === 'Duy' ? 'duy' : 'nghia';

        row.innerHTML = `
          ${entry.photo
            ? `<img class="thumb" src="${entry.photo}" alt="${entry.item}">`
            : `<div class="thumb-placeholder">—</div>`}
          <div class="info">
            <div class="item-name">${escapeHtml(entry.item)}</div>
            <div class="date-tag">${dateStr} · <span class="tag ${tagClass}">${entry.person}</span></div>
          </div>
          <div class="price">${fmtVND(entry.price)}</div>
          <button class="del" title="Xoá">✕</button>
        `;

        if(entry.photo){
          row.querySelector('.thumb').addEventListener('click', () => {
            lightboxImg.src = entry.photo;
            lightbox.classList.add('show');
          });
        }
        row.querySelector('.del').addEventListener('click', async (ev) => {
          ev.stopPropagation();
          const pin = await askPin();
          if(pin === null) return;
          if(pin !== DELETE_PIN){
            alert('Sai mã, không thể xoá.');
            return;
          }
          try{
            await expensesRef.doc(entry.id).delete();
          }catch(e){
            alert('Không xoá được, kiểm tra lại kết nối mạng.');
          }
        });

        ledgerEl.appendChild(row);
      });
    }

    const totalDuy = monthEntries.filter(e => e.person === 'Duy').reduce((s,e) => s + e.price, 0);
    const totalNghia = monthEntries.filter(e => e.person === 'Nghĩa').reduce((s,e) => s + e.price, 0);
    stampWrap.innerHTML = monthEntries.length === 0 ? '' : `
      <div class="stamp">
        <div class="lines">
          <div><div class="who">DUY</div><div class="amt">${fmtVND(totalDuy)}</div></div>
          <div><div class="who">NGHĨA</div><div class="amt">${fmtVND(totalNghia)}</div></div>
        </div>
        <div class="grand">Tổng cộng: ${fmtVND(totalDuy + totalNghia)}</div>
      </div>
    `;
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  listenEntries();
})();
</script>
</body>
</html>
